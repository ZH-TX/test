<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#05040e">
	<link rel="icon" href="data:,">
	<title>生日快乐 🎂</title>
	<link rel="stylesheet" href="css/demo.css">
	<link rel="stylesheet" href="css/story.css">
</head>

<body>
	<!-- 第三幕的底：星尘 / 蛋糕 / 烟花都画在这张 canvas 上 -->
	<!-- 音乐没响时的提示：点一下强制开启，同时进入内容 -->
	<button class="music-hint" id="musicHint" type="button">
		<span class="music-hint-icon">♪</span>没有音乐？点这里开启
	</button>

	<audio id="storyMusic" src="music/story.mp3" preload autoplay loop playsinline webkit-playsinline type="audio/mp3"></audio>
	<canvas id="stage"></canvas>

	<!-- ============ 第 0 幕：轻触开启 ============ -->
	<div class="splash" id="splash">
		<div class="splash-inner">
			<div class="splash-stage">
				<!-- 信封：点一下才拆 -->
				<div class="envelope">
					<div class="env-body">
						<span class="env-heart">❤</span>
						<!-- 邮戳 -->
						<div class="env-stamp" aria-hidden="true">
							<svg viewBox="0 0 100 100">
								<defs>
									<path id="stampArc" d="M 18,54 A 32,32 0 0 1 82,54" fill="none" />
								</defs>
								<circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="2.6" />
								<circle cx="50" cy="50" r="39.5" fill="none" stroke="currentColor" stroke-width="0.9" />
								<text font-size="9.5" letter-spacing="1.5" fill="currentColor">
									<textPath href="#stampArc" startOffset="50%" text-anchor="middle">WITH LOVE</textPath>
								</text>
								<text x="50" y="60" font-size="20" font-weight="800" letter-spacing="1.2"
									text-anchor="middle" fill="currentColor">LOVE</text>
								<text x="50" y="72" font-size="8" letter-spacing="2"
									text-anchor="middle" fill="currentColor">— ♥ —</text>
							</svg>
						</div>
					</div>
					<div class="env-flap"></div>
				</div>
				<div class="seal seal-photo">
					<img src="img/avator.jpg" alt="">
					<span class="seal-badge">❤</span>
				</div>
			</div>
			<p class="splash-hint">娇娇亲启</p>
		</div>
	</div>

	<!-- ============ 叙事九幕 ============ -->
	<!-- 叙事幕：内容是空的，全部由 js/story.js 里的 SCENES 数组生成。
	     要加内容去改那个数组，不要在这里写。 -->
	<div class="story" id="story"></div>

	<!-- 手动推进时的呼吸提示，由 js/story.js 控制显隐 -->
	<p class="tap-hint" id="tapHint">轻触继续</p>

	<!-- ============ 第三幕：互动控件 ============ -->
	<div class="ui">
		<div class="meter" id="meter"><i id="meterFill"></i></div>
		<p class="hint" id="hint"></p>
		<div class="actions" id="actions">
			<!-- <button id="micBtn" type="button">🎤 对着麦克风吹</button> -->
			<button id="holdBtn" type="button">👆 按住吹</button>
		</div>
	</div>

	<p class="caption" id="caption"></p>
	<button class="again" id="againBtn" type="button">再看一次</button>
	<button class="bgm" id="bgmBtn" type="button" title="背景音乐">♪</button>
	<!-- 跳过按钮：按要求先注释掉 -->
	<!-- <button class="skip" id="skipBtn" type="button" title="跳过叙事">跳过 ›</button> -->

	<script src="js/story.js"></script>
	<script src="js/demo.js"></script>
</body>

</html>
